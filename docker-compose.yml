services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "structural_php"
    container_name: "structural_app"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:z
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:latest
    container_name: "structural_nginx"
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:z
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - app

  mariadb:
    image: docker.io/library/mariadb:latest
    container_name: "structural_mariadb"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/storage:/mnt/storage:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "structural_php"
    container_name: "structural_vite"
    restart: unless-stopped
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./:/var/www/html:z
    ports:
      - "5173:5173"

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "structural_php"
    container_name: "structural_queue"
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:listen --tries=1
    volumes:
      - ./:/var/www/html:z
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_started
  
  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "structural_php"
    container_name: "structural_reverb"
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www/html:z
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_started

  phpmyadmin:
    image: docker.io/library/phpmyadmin:latest
    container_name: "structural_phpmyadmin"
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data: